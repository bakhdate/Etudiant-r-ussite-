<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Notes & Certificat - EduTeranga</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .note-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    #certificat {
      display: none;
      margin-top: 40px;
      padding: 30px;
      border: 5px solid #1e3c72;
      text-align: center;
    }

    #certificat h1 {
      color: #1e3c72;
    }
  </style>
</head>
<body>

<header>
  <h1>Notes & Certificat</h1>
  <p>EduTeranga - Valide les compétences de l'étudiant</p>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="etudiant.html">Espace Étudiant</a>
  <a href="admin.html">Admin</a>
</nav>

<div class="note-box">

  <h2>Entrer les informations</h2>

  <label>Nom de l'étudiant :</label>
  <input type="text" id="nom">

  <label>Matière :</label>
  <select id="matiere">
    <option>Mathématiques</option>
    <option>Probabilités</option>
    <option>Algorithmique</option>
    <option>Informatique</option>
  </select>

  <label>Note / 20 :</label>
  <input type="number" id="note">

  <button onclick="genererCertificat()">Générer le certificat</button>

</div>

<div id="certificat">
  <h1>Certificat de réussite</h1>
  <p>Ce certificat est décerné à :</p>
  <h2 id="nomCertif"></h2>

  <p>Pour sa réussite en :</p>
  <h2 id="matiereCertif"></h2>

  <p>Avec la note de :</p>
  <h2 id="noteCertif"></h2>

  <p><b>EduTeranga – 2025</b></p>
</div>

<script>
function genererCertificat() {

  let nom = document.getElementById("nom").value;
  let matiere = document.getElementById("matiere").value;
  let note = document.getElementById("note").value;

  if(nom == "" || note == "") {
    alert("Veuillez remplir tous les champs !");
    return;
  }

  if(note < 10) {
    alert("Note insuffisante pour obtenir le certificat !");
    return;
  }

  document.getElementById("certificat").style.display = "block";
  document.getElementById("nomCertif").innerText = nom;
  document.getElementById("matiereCertif").innerText = matiere;
  document.getElementById("noteCertif").innerText = note + " / 20";
}
</script>

</body>
</html>
