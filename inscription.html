<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - EduTeranga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Créer un compte EduTeranga</h1>
  <p>Inscris-toi et commence à apprendre gratuitement</p>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="etudiant.html">Espace étudiant</a>
  <a href="connexion.html">Connexion</a>
</nav>

<section>
  <h2>Formulaire d’inscription</h2>

  <form class="login-form">

    <label>Nom complet :</label>
    <input type="text" placeholder="Ex : Djily Ndiaye" required>

    <label>Email :</label>
    <input type="email" placeholder="Ex : djily@gmail.com" required>

    <label>Mot de passe :</label>
    <input type="password" placeholder="********" required>

    <label>Niveau d’étude :</label>
    <select required>
      <option>Terminale</option>
      <option>Licence 1</option>
      <option>Licence 2</option>
      <option>Licence 3</option>
      <option>Autre</option>
    </select>

    <label>Matière préférée :</label>
    <select>
      <option>Mathématiques</option>
      <option>Probabilités</option>
      <option>Algorithmique</option>
      <option>Informatique</option>
    </select>

    <button type="submit">S'inscrire</button>
  </form>

  <p><b>Note :</b> Ceci est une démonstration pour le hackathon.</p>
</section>

<footer>
  <p>© 2025 - EduTeranga | Page Inscription</p>
</footer>

</body>
</html>
